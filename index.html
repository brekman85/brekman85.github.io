<body><div class="wrap">
<div class="top"><h1>📐 Геометрия 9</h1><div class="pts" id="pts">0 ₽</div></div>
<div class="mut" id="hello">Темы 9 класса и задачи как в ОГЭ. Ответ — число; если нужен корень, пиши десятичной дробью (2√3 ≈ 3,46).</div>

<div class="card" id="play" hidden>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)], r2=x=>Math.round(x*100)/100;
const rad=d=>d*Math.PI/180, sin=d=>Math.sin(rad(d)), cos=d=>Math.cos(rad(d));
const fmt=x=>String(r2(x)).replace('.',',');
const tri=(lbl)=>`<svg width="260" height="150" viewBox="0 0 260 150"><polygon points="20,130 240,130 70,20" fill="#eef4ff" stroke="#2f6fd6" stroke-width="3"/><text x="8" y="146" font-size="16">A</text><text x="242" y="146" font-size="16">B</text><text x="64" y="15" font-size="16">C</text>${lbl||''}</svg>`;
const rtri=`<svg width="260" height="150" viewBox="0 0 260 150"><polygon points="20,130 240,130 20,20" fill="#eef4ff" stroke="#2f6fd6" stroke-width="3"/><rect x="20" y="114" width="16" height="16" fill="none" stroke="#2f6fd6"/><text x="6" y="146" font-size="16">C</text><text x="242" y="146" font-size="16">B</text><text x="6" y="18" font-size="16">A</text></svg>`;
const T={
 trig:{name:'Синус, косинус, тангенс',th:'В прямоугольном треугольнике:\nsin A = противолежащий катет / гипотенуза\ncos A = прилежащий катет / гипотенуза\ntg A = противолежащий / прилежащий\nsin²α + cos²α = 1',
  gen(){const k=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25]]),m=R(1,3),[a,b,c]=k.map(x=>x*m);const v=R(0,2);
   if(v===0)return{pic:rtri,q:`В треугольнике ABC угол C = 90°, BC = ${a}, AB = ${c}.\nНайдите sin A.`,a:a/c,h:`sin A = BC / AB = ${a}/${c}.`};
   if(v===1)return{pic:rtri,q:`В треугольнике ABC угол C = 90°, AC = ${b}, AB = ${c}.\nНайдите cos A.`,a:b/c,h:`cos A = AC / AB = ${b}/${c}.`};
   const s=pick([[3,5,4],[5,13,12],[8,17,15],[7,25,24]]);return{q:`sin α = ${s[0]}/${s[1]}, угол α острый.\nНайдите cos α.`,a:s[2]/s[1],h:`cos α = √(1 − sin²α) = √(1 − ${s[0]*s[0]}/${s[1]*s[1]}) = ${s[2]}/${s[1]}.`};}},
 sq:{name:'Площадь треугольника через синус',th:'S = ½ · a · b · sin C — половина произведения двух сторон на синус угла между ними.\nsin 30° = 0,5;  sin 45° ≈ 0,71;  sin 60° ≈ 0,87;  sin 150° = 0,5',
  gen(){const a=R(4,16),b=R(4,16),C=pick([30,150,90]);return{pic:tri(),q:`В треугольнике ABC: AC = ${a}, BC = ${b}, угол C = ${C}°.\nНайдите площадь треугольника.`,a:0.5*a*b*sin(C),h:`S = ½ · ${a} · ${b} · sin ${C}° = ½ · ${a} · ${b} · ${fmt(sin(C))}.`};}},
 cos:{name:'Теорема косинусов',th:'c² = a² + b² − 2ab · cos C\ncos 60° = 0,5;  cos 120° = −0,5;  cos 90° = 0',
  gen(){const a=R(3,12),b=R(3,12),C=pick([60,120,90]);const c2=a*a+b*b-2*a*b*cos(C);return{pic:tri(),q:`В треугольнике ABC: AC = ${a}, BC = ${b}, угол C = ${C}°.\nНайдите AB². (В ответе — квадрат стороны)`,a:c2,h:`AB² = ${a}² + ${b}² − 2·${a}·${b}·cos ${C}° = ${a*a} + ${b*b} − ${2*a*b}·(${fmt(cos(C))}).`};}},
 sin:{name:'Теорема синусов',th:'a / sin A = b / sin B = c / sin C = 2R\n(R — радиус описанной окружности)',
  gen(){const v=R(0,1);if(v===0){const R0=R(2,12),A=pick([30,90,150]);return{pic:tri(),q:`Радиус описанной окружности треугольника ABC равен ${R0}, угол A = ${A}°.\nНайдите сторону BC.`,a:2*R0*sin(A),h:`BC = 2R · sin A = 2 · ${R0} · sin ${A}°.`};}
   const a=R(2,10)*2;return{pic:tri(),q:`В треугольнике ABC: BC = ${a}, угол A = 30°.\nНайдите радиус описанной окружности.`,a:a,h:`2R = BC / sin A = ${a} / 0,5 = ${2*a}, значит R = ${a}.`};}},
 vec:{name:'Векторы и координаты',th:'Вектор AB = (x₂ − x₁; y₂ − y₁)\nДлина |a| = √(x² + y²)\nСередина отрезка: ((x₁ + x₂)/2; (y₁ + y₂)/2)\nСкалярное произведение: a·b = x₁x₂ + y₁y₂',
  gen(){const v=R(0,3);const x1=R(-6,6),y1=R(-6,6);
   if(v===0){const k=pick([[3,4],[6,8],[5,12],[8,6],[-3,4],[0,7]]);return{q:`A(${x1}; ${y1}), B(${x1+k[0]}; ${y1+k[1]}).\nНайдите длину вектора AB.`,a:Math.hypot(k[0],k[1]),h:`AB = (${k[0]}; ${k[1]}), |AB| = √(${k[0]}² + ${k[1]}²).`};}
   if(v===1){const x2=x1+2*R(-4,4),y2=y1+2*R(-4,4);return{q:`A(${x1}; ${y1}), B(${x2}; ${y2}).\nНайдите абсциссу (x) середины отрезка AB.`,a:(x1+x2)/2,h:`x = (${x1} + ${x2}) / 2.`};}
   if(v===2){const a=[R(-5,5),R(-5,5)],b=[R(-5,5),R(-5,5)];return{q:`a = (${a[0]}; ${a[1]}), b = (${b[0]}; ${b[1]}).\nНайдите скалярное произведение a · b.`,a:a[0]*b[0]+a[1]*b[1],h:`a·b = ${a[0]}·${b[0]} + ${a[1]}·${b[1]}.`};}
   const a=[R(-5,5),R(-5,5)],k=R(2,4);return{q:`a = (${a[0]}; ${a[1]}). Вектор b = ${k}a.\nНайдите сумму координат вектора b.`,a:k*(a[0]+a[1]),h:`b = (${k*a[0]}; ${k*a[1]}).`};}},
 circ:{name:'Окружность и правильные многоугольники',th:'Длина окружности C = 2πR, площадь круга S = πR².\nДлина дуги в n°: πRn/180.\nСумма углов n-угольника: 180°·(n − 2).\nУ правильного шестиугольника сторона равна радиусу описанной окружности.',
  gen(){const v=R(0,6);
   if(v===4){const r=R(2,40);return{q:`Радиус окружности равен ${r}. Возьмите π = 3,14.\nНайдите длину окружности.`,a:2*3.14*r,h:`C = 2πR = 2·3,14·${r}.`};}
   if(v===5){const r=R(2,40);return{q:`Длина окружности равна ${fmt(2*3.14*r)}. Возьмите π = 3,14.\nНайдите радиус.`,a:r,h:`R = C / (2π) = ${fmt(2*3.14*r)} / (2·3,14).`};}
   if(v===6){const r=R(2,20);return{q:`Радиус круга равен ${r}. Возьмите π = 3,14.\nНайдите площадь круга.`,a:3.14*r*r,h:`S = πR² = 3,14·${r}² = 3,14·${r*r}.`};}
   if(v===0){const r=R(2,15);return{q:`Радиус окружности равен ${r}.\nНайдите длину окружности, делённую на π.`,a:2*r,h:`C = 2πR = ${2*r}π.`};}
   if(v===1){const r=R(2,12);return{q:`Радиус круга равен ${r}.\nНайдите площадь круга, делённую на π.`,a:r*r,h:`S = πR² = ${r*r}π.`};}
   if(v===2){const n=R(5,12);return{q:`Найдите угол правильного ${n}-угольника (в градусах).`,a:180*(n-2)/n,h:`Сумма углов = 180°·(${n} − 2) = ${180*(n-2)}°, один угол = ${180*(n-2)}° / ${n}.`};}
   const a=R(3,15);return{q:`Сторона правильного шестиугольника равна ${a}.\nНайдите радиус описанной окружности.`,a:a,h:'У правильного шестиугольника R = стороне.'};}},
 oge:{name:'Смешанные задачи (как в ОГЭ)',th:'Площади: треугольник ½·a·h, параллелограмм a·h, трапеция ½(a + b)·h, ромб ½·d₁·d₂.\nТеорема Пифагора: c² = a² + b².\nВписанный угол = половине дуги, центральный = дуге.',
  gen(){const v=R(0,3);
   if(v===0){const a=R(3,12),b=a+R(2,10),h=R(2,10);return{q:`Основания трапеции равны ${a} и ${b}, высота ${h}.\nНайдите площадь трапеции.`,a:(a+b)*h/2,h:`S = ½ · (${a} + ${b}) · ${h}.`};}
   if(v===1){const d1=R(4,20),d2=R(4,20);return{q:`Диагонали ромба равны ${d1} и ${d2}.\nНайдите площадь ромба.`,a:d1*d2/2,h:`S = ½ · ${d1} · ${d2}.`};}
   if(v===2){const k=R(20,170);return{q:`Дуга окружности AB равна ${2*k}°.
Найдите вписанный угол, опирающийся на эту дугу.`,a:k,h:`Вписанный угол = половина дуги = ${2*k}° / 2.`};}
   const k=pick([[3,4,5],[5,12,13],[6,8,10],[9,12,15],[8,15,17]]);return{pic:rtri,q:`Катеты прямоугольного треугольника равны ${k[0]} и ${k[1]}.\nНайдите гипотенузу.`,a:k[2],h:`c = √(${k[0]}² + ${k[1]}²) = √${k[0]*k[0]+k[1]*k[1]}.`};}},
 vop:{name:'Векторы: действия и разложение',th:'a + b = (x₁ + x₂; y₁ + y₂),  a − b = (x₁ − x₂; y₁ − y₂),  k·a = (k·x; k·y).\nABCD — параллелограмм ⇔ вектор AB = вектору DC.\nРазложение: c = x·a + y·b (векторы a и b не лежат на одной прямой).\nСредняя линия треугольника: MN = ½·BC, MN ∥ BC. Средняя линия трапеции = (a + b) / 2.\ncos угла между a и b = (a · b) / (|a| · |b|)',
  gen(){const v=R(0,8),a=[R(-6,6),R(-6,6)],b=[R(-6,6),R(-6,6)];
   if(v===0)return{q:`a = (${a[0]}; ${a[1]}), b = (${b[0]}; ${b[1]}).\nНайдите абсциссу (x) вектора a + b.`,a:a[0]+b[0],h:`x = ${a[0]} + (${b[0]}).`};
   if(v===1)return{q:`a = (${a[0]}; ${a[1]}), b = (${b[0]}; ${b[1]}).\nНайдите ординату (y) вектора a − b.`,a:a[1]-b[1],h:`y = ${a[1]} − (${b[1]}).`};
   if(v===2){const k=R(2,4);return{q:`a = (${a[0]}; ${a[1]}), b = (${b[0]}; ${b[1]}).\nНайдите абсциссу (x) вектора ${k}a − b.`,a:k*a[0]-b[0],h:`x = ${k}·(${a[0]}) − (${b[0]}).`};}
   if(v===3){const A=[R(-5,5),R(-5,5)],B=[R(-5,5),R(-5,5)],C=[R(-5,5),R(-5,5)];return{q:`ABCD — параллелограмм. A(${A[0]}; ${A[1]}), B(${B[0]}; ${B[1]}), C(${C[0]}; ${C[1]}).\nНайдите абсциссу (x) точки D.`,a:A[0]+C[0]-B[0],h:`Вектор AB = вектору DC, значит D = A + C − B. x = ${A[0]} + (${C[0]}) − (${B[0]}).`};}
   if(v===7){const c=2*R(2,12);return{q:`M и N — середины сторон AB и AC треугольника ABC. BC = ${c}.\nНайдите MN.`,a:c/2,h:'MN — средняя линия: MN = ½·BC.'};}
   if(v===8){const x=R(2,10),y=x+2*R(1,5);return{q:`Основания трапеции равны ${x} и ${y}.\nНайдите среднюю линию трапеции.`,a:(x+y)/2,h:`Средняя линия = (${x} + ${y}) / 2.`};}
   if(v===4){let p,q2;do{p=[R(1,3),R(0,2)];q2=[R(0,2),R(1,3)]}while(p[0]*q2[1]-p[1]*q2[0]===0);const x=R(-3,3),y=R(-3,3),c=[x*p[0]+y*q2[0],x*p[1]+y*q2[1]];
    return{q:`a = (${p[0]}; ${p[1]}), b = (${q2[0]}; ${q2[1]}), c = (${c[0]}; ${c[1]}).\nВектор c = x·a + y·b. Найдите x.`,a:x,h:`Запиши по координатам:\n${c[0]} = x·${p[0]} + y·${q2[0]}\n${c[1]} = x·${p[1]} + y·${q2[1]}\nРеши систему (подстановкой или сложением). Здесь y = ${y}.`};}
   const P=pick([[[2,0],[0,3]],[[1,0],[2,2]],[[0,3],[-4,-4]],[[1,1],[2,2]],[[1,0],[-3,0]],[[3,0],[0,-2]]]);const dot=P[0][0]*P[1][0]+P[0][1]*P[1][1],cs=dot/(Math.hypot(...P[0])*Math.hypot(...P[1]));
   return{q:`a = (${P[0][0]}; ${P[0][1]}), b = (${P[1][0]}; ${P[1][1]}).\nНайдите угол между векторами (в градусах).`,a:Math.round(Math.acos(Math.max(-1,Math.min(1,cs)))*180/Math.PI),h:`a·b = ${dot}, |a|·|b| = ${fmt(Math.hypot(...P[0])*Math.hypot(...P[1]))}, cos φ = ${fmt(cs)}. Какой угол имеет такой косинус?`};}},
 kor:{name:'Метод координат: расстояние, окружность, прямая',th:'Расстояние между A(x₁; y₁) и B(x₂; y₂): √((x₂ − x₁)² + (y₂ − y₁)²).\nОкружность с центром (a; b) и радиусом r: (x − a)² + (y − b)² = r².\nПрямая y = kx + b: k = (y₂ − y₁)/(x₂ − x₁), b = y₁ − k·x₁.',
  gen(){const v=R(0,5),x1=R(-6,6),y1=R(-6,6);
   if(v===0){const k=pick([[3,4],[6,8],[5,12],[8,6],[-3,4],[12,5]]);return{q:`A(${x1}; ${y1}), B(${x1+k[0]}; ${y1+k[1]}).\nНайдите расстояние между точками A и B.`,a:Math.hypot(k[0],k[1]),h:`AB = √((${k[0]})² + (${k[1]})²).`};}
   const r=pick([3,4,5,6,7,10]),t=(s,c)=>c===0?`${s}²`:`(${s} ${c>0?'−':'+'} ${Math.abs(c)})²`,eq=`${t('x',x1)} + ${t('y',y1)} = ${r*r}`;
   if(v===1)return{q:`Окружность задана уравнением ${eq}.\nНайдите радиус.`,a:r,h:`Правая часть — это r² = ${r*r}, значит r = √${r*r}.`};
   if(v===2)return{q:`Окружность задана уравнением ${eq}.\nНайдите абсциссу (x) центра.`,a:x1,h:`В скобке (x − a), где a — абсцисса центра. Смотри на знак: (x + 3) значит a = −3.`};
   if(v===3||v===4){const k=R(-4,4),d=R(1,3);return{q:`Прямая y = kx + b проходит через точки A(${x1}; ${y1}) и B(${x1+d}; ${y1+k*d}).\n${v===3?'Найдите k.':'Найдите b.'}`,a:v===3?k:y1-k*x1,h:`k = (${y1+k*d} − (${y1})) / (${x1+d} − (${x1})) = ${k}. ${v===4?`Подставь точку A: b = ${y1} − (${k})·(${x1}).`:''}`};}
   return{q:`Окружность: ${t('x',x1)} + ${t('y',y1)} = 25.\nТочка M(${x1+3}; y) лежит на окружности и выше центра.\nНайдите y.`,a:y1+4,h:`Подставь x = ${x1+3}: (3)² + (y − (${y1}))² = 25, значит (y − (${y1}))² = 16, то есть y − (${y1}) = 4 (выше центра).`};}},
 tr2:{name:'Решение треугольников',th:'Сумма углов треугольника 180°.\nТеорема синусов: a / sin A = b / sin B.\nТеорема косинусов: cos C = (a² + b² − c²) / (2ab), где c — сторона против угла C.\nsin 30° = 0,5;  sin 45° ≈ 0,71;  sin 60° ≈ 0,87;  sin 90° = 1',
  gen(){const v=R(0,4);
   if(v===0){const A=R(30,80),B=R(30,80);return{pic:tri(),q:`В треугольнике ABC: угол A = ${A}°, угол B = ${B}°.\nНайдите угол C (в градусах).`,a:180-A-B,h:`C = 180° − ${A}° − ${B}°.`};}
   if(v===1){const P=pick([[30,90],[30,45],[45,90],[30,60],[60,90],[45,30]]),a=R(3,12);return{pic:tri(),q:`В треугольнике ABC: BC = ${a}, угол A = ${P[0]}°, угол B = ${P[1]}°.\nНайдите AC.`,a:a*sin(P[1])/sin(P[0]),h:`AC / sin B = BC / sin A, значит AC = ${a}·sin ${P[1]}° / sin ${P[0]}°.`};}
   if(v===3){const A=pick([40,50,70,80]),B=pick([35,55,65,75]),a=R(5,20);return{pic:tri(),q:`В треугольнике ABC: BC = ${a}, угол A = ${A}°, угол B = ${B}°.\nНайдите AC (с калькулятором, до десятых).`,a:a*sin(B)/sin(A),h:`AC / sin B = BC / sin A, значит AC = ${a}·sin ${B}° / sin ${A}°.`};}
   if(v===4){const A=pick([48,36,64,72]),b=R(5,20),c=R(5,20);return{pic:tri(),q:`В треугольнике ABC: AB = ${c}, AC = ${b}, угол A = ${A}°.\nНайдите площадь треугольника (с калькулятором, до десятых).`,a:0.5*b*c*sin(A),h:`S = ½·AB·AC·sin A = ½·${c}·${b}·sin ${A}°.`};}
   const T3=pick([[3,5,7],[5,8,7],[7,8,13],[3,8,7]]);const [a,b,c]=T3,cs=(a*a+b*b-c*c)/(2*a*b);
   return{pic:tri(),q:`В треугольнике ABC: AC = ${a}, BC = ${b}, AB = ${c}.\nНайдите угол C (в градусах).`,a:Math.round(Math.acos(cs)*180/Math.PI),h:`cos C = (${a}² + ${b}² − ${c}²) / (2·${a}·${b}) = ${fmt(cs)}. Какой угол имеет такой косинус?`};}},
 mn:{name:'Правильные многоугольники',th:'Сторона a = 2R·sin(180°/n), радиус вписанной окружности r = R·cos(180°/n); r = a / (2·tg(180°/n)).\nКвадрат: a = R√2.  Шестиугольник: a = R.  Треугольник: a = R√3.\nПлощадь правильного многоугольника S = ½·P·r (P — периметр, r — радиус вписанной окружности).',
  gen(){const n=pick([3,4,6]),nm={3:'треугольника',4:'четырёхугольника (квадрата)',6:'шестиугольника'}[n],v=R(0,3),ang=180/n;
   if(v===0){const R0=R(2,12);return{q:`Радиус окружности, описанной около правильного ${nm}, равен ${R0}.\nНайдите сторону.`,a:2*R0*sin(ang),h:`a = 2R·sin(180°/${n}) = 2·${R0}·sin ${ang}°.`};}
   if(v===1){const R0=R(2,12);return{q:`Радиус окружности, описанной около правильного ${nm}, равен ${R0}.\nНайдите радиус вписанной окружности.`,a:R0*cos(ang),h:`r = R·cos(180°/${n}) = ${R0}·cos ${ang}°.`};}
   if(v===3){const a=2*R(1,6),r=a/(2*Math.tan(rad(ang)));return{q:`Сторона правильного ${nm} равна ${a}.\nНайдите площадь.`,a:0.5*n*a*r,h:`P = ${n}·${a} = ${n*a}; r = a / (2·tg ${ang}°) = ${fmt(r)}; S = ½·P·r.`};}
   const a=2*R(1,6);return{q:`Сторона правильного ${nm} равна ${a}.\nНайдите радиус вписанной окружности.`,a:a/(2*Math.tan(rad(ang))),h:`r = a / (2·tg(180°/${n})) = ${a} / (2·tg ${ang}°).`};}},
 arc:{name:'Длина дуги и площадь сектора',th:'Длина дуги в n°: l = πRn/180.\nПлощадь сектора в n°: S = πR²n/360.\nПолный круг — 360°.\nРадианная мера: π рад = 180°, 1 рад = 180°/π; α рад = α·180°/π градусов.',
  gen(){const v=R(0,4),R0=6*R(1,3),n=30*R(1,10);
   if(v===0)return{q:`Радиус окружности ${R0}. Дуга содержит ${n}°.\nНайдите длину дуги, делённую на π.`,a:R0*n/180,h:`l = π·${R0}·${n}/180, делим на π: ${R0}·${n}/180.`};
   if(v===1)return{q:`Радиус круга ${R0}. Сектор имеет угол ${n}°.\nНайдите площадь сектора, делённую на π.`,a:R0*R0*n/360,h:`S = π·${R0}²·${n}/360, делим на π: ${R0*R0}·${n}/360.`};
   if(v===3){const P=pick([[1,6],[1,4],[1,3],[1,2],[2,3],[3,4],[5,6]]);return{q:`Угол равен ${P[0]===1?'':P[0]}π/${P[1]} радиан.\nНайдите его в градусах.`,a:P[0]*180/P[1],h:`π рад = 180°, значит ${P[0]===1?'':P[0]+'·'}180° / ${P[1]}.`};}
   if(v===4){const D=pick([30,45,60,90,120,135,150,180]);return{q:`Угол равен ${D}°.\nНайдите его радианную меру, делённую на π (десятичной дробью, например 0,25).`,a:D/180,h:`Радианная мера = ${D}·π/180, делим на π: ${D}/180.`};}
   return{q:`Радиус окружности ${R0}. Длина дуги равна ${R0*n/180}π.\nНайдите угловую меру дуги (в градусах).`,a:n,h:`l = πRn/180, значит n = 180·l / (πR) = 180·${R0*n/180} / ${R0}.`};}},
 mov:{name:'Движения: симметрия, перенос, поворот',th:'Осевая симметрия относительно оси Ox: (x; y) → (x; −y); относительно Oy: (x; y) → (−x; y); относительно прямой x = c: x → 2c − x.\nЦентральная симметрия относительно точки M(m; n): (2m − x; 2n − y).\nПараллельный перенос на вектор (p; q): (x + p; y + q).\nПоворот вокруг начала на 90° против часовой стрелки: (x; y) → (−y; x); по часовой: (x; y) → (y; −x).\nЦентральная симметрия относительно начала: (x; y) → (−x; −y).\nУ правильного n-угольника n осей симметрии.',
  gen(){const v=R(0,8),x=R(-7,7),y=R(-7,7);
   if(v===0)return{q:`Точку A(${x}; ${y}) отразили относительно оси Ox.\nНайдите ординату (y) образа.`,a:-y,h:'При симметрии относительно Ox меняется знак у ординаты: y → −y.'};
   if(v===1)return{q:`Точку A(${x}; ${y}) отразили относительно оси Oy.\nНайдите абсциссу (x) образа.`,a:-x,h:'При симметрии относительно Oy меняется знак у абсциссы: x → −x.'};
   if(v===2){const m=R(-4,4);return{q:`Точку A(${x}; ${y}) отразили симметрично относительно точки M(${m}; 0).\nНайдите абсциссу (x) образа.`,a:2*m-x,h:`M — середина отрезка между A и образом: x' = 2·${m} − (${x}).`};}
   if(v===3){const p=R(-5,5),q=R(-5,5);return{q:`Точку A(${x}; ${y}) перенесли параллельно на вектор (${p}; ${q}).\nНайдите ординату (y) образа.`,a:y+q,h:`y' = ${y} + (${q}).`};}
   if(v===4)return{q:`Точку A(${x}; ${y}) повернули вокруг начала координат на 90° против часовой стрелки.\nНайдите абсциссу (x) образа.`,a:-y,h:'При повороте на 90° против часовой: (x; y) → (−y; x). Новая абсцисса равна −y.'};
   if(v===5){const n=R(3,12);return{q:`Сколько осей симметрии у правильного ${n}-угольника?`,a:n,h:'У правильного n-угольника n осей симметрии.'};}
   if(v===7)return{q:`Точку A(${x}; ${y}) отразили симметрично относительно начала координат.\nНайдите ординату (y) образа.`,a:-y,h:'Центральная симметрия относительно начала: (x; y) → (−x; −y).'};
   if(v===8)return{q:`Точку A(${x}; ${y}) повернули вокруг начала координат на 90° по часовой стрелке.\nНайдите ординату (y) образа.`,a:-x,h:'Поворот на 90° по часовой: (x; y) → (y; −x). Новая ордината равна −x.'};
   const c=R(-4,4);return{q:`Точку A(${x}; ${y}) отразили относительно прямой x = ${c}.\nНайдите абсциссу (x) образа.`,a:2*c-x,h:`Прямая x = ${c} — середина между A и образом: x' = 2·${c} − (${x}).`};}},
 tg2:{name:'Тригонометрия: углы от 0° до 180°',th:'Для угла α от 0° до 180° точка единичной полуокружности: (cos α; sin α). На окружности радиуса R: (R·cos α; R·sin α).\nsin(180° − α) = sin α,  cos(180° − α) = −cos α.\nsin²α + cos²α = 1;  tg α = sin α / cos α;  ctg α = cos α / sin α = 1 / tg α.\nУгловой коэффициент прямой k = tg α, где α — угол с осью Ox.\nsin 30° = 0,5;  sin 45° ≈ 0,71;  sin 60° ≈ 0,87;  cos 60° = 0,5;  tg 45° = 1',
  gen(){const v=R(0,5);
   if(v===0){const a=pick([120,135,150]);return{q:`Найдите sin ${a}°.`,a:sin(a),h:`sin ${a}° = sin(180° − ${a}°) = sin ${180-a}°.`};}
   if(v===1){const a=pick([120,135,150]);return{q:`Найдите cos ${a}°.`,a:cos(a),h:`cos ${a}° = −cos(180° − ${a}°) = −cos ${180-a}°.`};}
   if(v===2){const t=pick([0.5,2,4,0.25,5]);return{q:`tg α = ${String(t).replace('.',',')}. Найдите ctg α.`,a:1/t,h:'ctg α = 1 / tg α.'};}
   if(v===3){const P=pick([[0.6,0.8],[0.8,0.6],[0.28,0.96],[0.96,0.28]]),ob=R(0,1)===1;return{q:`sin α = ${String(P[0]).replace('.',',')}, угол α ${ob?'тупой':'острый'}.\nНайдите cos α.`,a:ob?-P[1]:P[1],h:`cos²α = 1 − sin²α = 1 − ${fmt(P[0]*P[0])} = ${fmt(P[1]*P[1])}, значит |cos α| = ${String(P[1]).replace('.',',')}. ${ob?'У тупого угла косинус отрицательный.':'У острого угла косинус положительный.'}`};}
   if(v===4){const Rr=pick([2,4,6,8,10]),a=pick([60,120,135,150]);return{q:`Точка M лежит на окружности x² + y² = ${Rr*Rr}, луч OM образует с осью Ox угол ${a}°.\nНайдите абсциссу (x) точки M.`,a:Rr*cos(a),h:`x = R·cos α = ${Rr}·cos ${a}°.`};}
   const a=pick([45,135,60,120]);return{q:`Прямая образует с осью Ox угол ${a}°.\nНайдите её угловой коэффициент k.`,a:Math.tan(rad(a)),h:`k = tg α = tg ${a}°. Для 135° и 120° тангенс отрицательный.`};}},
 sim:{name:'Подобие фигур',th:'Подобные фигуры: сходственные стороны пропорциональны, k — коэффициент подобия.\nОтношение периметров = k, отношение площадей = k².\nГомотетия с центром O и коэффициентом k: точка A переходит в A₁, где OA₁ = k·OA. Если центр — начало координат: (x; y) → (kx; ky).\nПрямая, параллельная стороне треугольника, отсекает подобный треугольник.',
  gen(){const v=R(0,6),k=pick([2,3,4,5]);
   if(v===0){const k2=pick([1.5,2,2.5,3,0.5]),a=R(2,9)*2,b=R(2,9)*2;return{q:`Треугольники ABC и A₁B₁C₁ подобны. AB = ${a}, A₁B₁ = ${fmt(a*k2)}, BC = ${b}.\nНайдите B₁C₁.`,a:b*k2,h:`k = A₁B₁ / AB = ${fmt(a*k2)} / ${a} = ${fmt(k2)}. B₁C₁ = k·BC = ${fmt(k2)}·${b}.`};}
   if(v===1){const P=R(5,30),k2=pick([2,3,0.5,1.5]);return{q:`Многоугольники подобны, коэффициент подобия ${fmt(k2)}. Периметр первого равен ${P}.\nНайдите периметр второго.`,a:P*k2,h:`Периметры относятся как k: ${P}·${fmt(k2)}.`};}
   if(v===2){const S=R(2,12);return{q:`Многоугольники подобны, коэффициент подобия ${k}. Площадь первого равна ${S}.\nНайдите площадь второго.`,a:S*k*k,h:`Площади относятся как k²: ${S}·${k}² = ${S}·${k*k}.`};}
   if(v===3){const S=R(2,9);return{q:`Площади подобных многоугольников равны ${S} и ${S*k*k}.\nНайдите коэффициент подобия (больший к меньшему).`,a:k,h:`k² = ${S*k*k} / ${S} = ${k*k}, значит k = √${k*k}.`};}
   if(v===4){const x=R(-6,6),y=R(-6,6),g=pick([2,3,-1,-2,4]);return{q:`Гомотетия с центром в начале координат и коэффициентом ${g} переводит точку A(${x}; ${y}) в точку A₁.\nНайдите абсциссу (x) точки A₁.`,a:g*x,h:`x₁ = k·x = ${g}·(${x}).`};}
   if(v===5){let x=0;while(x===0)x=R(-6,6);const y=R(-6,6),g=pick([2,3,-1,-2,4]);return{q:`Гомотетия с центром в начале координат переводит A(${x}; ${y}) в A₁(${g*x}; ${g*y}).\nНайдите коэффициент гомотетии.`,a:g,h:`k = x₁ / x = ${g*x} / (${x}).`};}
   const BD=R(2,6),BA=BD+R(1,6),AC=BA*R(1,3);return{pic:tri(),q:`В треугольнике ABC на стороне AB отмечена точка D, на стороне BC — точка E, причём DE ∥ AC. BD = ${BD}, BA = ${BA}, AC = ${AC}.\nНайдите DE.`,a:AC*BD/BA,h:`Треугольники BDE и BAC подобны, k = BD / BA = ${BD}/${BA}. DE = k·AC.`};}}
};
let S;try{S=JSON.parse(localStorage.getItem('geo9'))}catch(e){} S=S||{pts:0,done:{},ok:{}};const save=()=>{try{localStorage.setItem('geo9',JSON.stringify(S))}catch(e){}};
// Копилка (виртуальные рубли): +10 ₽ за верный ответ, +50 ₽ за каждые 5 верных подряд. За ошибки ничего не снимается.
const RUB=10,BONUS=5,BONUS_RUB=50,GOAL=500;
if(S.rub===undefined)S.rub=S.pts*RUB; // старые звёзды переводятся в рубли, прогресс не теряется
const weekKey=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function wk(){const k=weekKey();if(!S.wk||S.wk.k!==k){if(S.wk&&S.wk.done){S.prev=S.wk}S.wk={k:k,done:0,ok:0,rub:0}}return S.wk}
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&u.first_name)document.getElementById('hello').textContent=u.first_name+', выбери тему. Ответ — число, корни пиши десятичной дробью.'}
let mode,cur,answered,streak=0,mix=null,sess={start:Date.now(),done:0,ok:0,bad:{}};
function pig(){const w=wk(),p=Math.min(100,Math.round(w.rub/GOAL*100));
 const prev=S.prev?`<div class="mut" style="margin-top:6px">Прошлая неделя: ${S.prev.rub} ₽ (верно ${S.prev.ok} из ${S.prev.done})</div>`:'';
 return`<div class="pig"><div class="mut">🐷 Копилка</div><div class="big">${S.rub} ₽</div>
 <div class="mut" style="margin-top:6px">Эта неделя: <b>${w.rub} ₽</b> · верно ${w.ok} из ${w.done}</div>
 <div class="bar"><i style="width:${p}%"></i></div>
 <div class="mut" style="margin-top:4px">${w.rub>=GOAL?'🎉 Цель недели выполнена — '+GOAL+' ₽!':'Цель недели: '+GOAL+' ₽ (ещё '+(GOAL-w.rub)+' ₽)'}</div>${prev}
 <div class="mut" style="margin-top:6px;font-size:13px">+${RUB} ₽ за верный ответ, +${BONUS_RUB} ₽ за каждые ${BONUS} верных подряд. За ошибки рубли не отнимаются. Рубли виртуальные.</div></div>`}
function menu(){document.getElementById('pts').textContent=S.rub+' ₽';document.getElementById('menu').innerHTML=pig()+'<div class="card"><b>Темы</b> <span class="mut">— нажми на тему или отметь несколько ☑ и жми «Тренировка»</span>'+Object.entries(T).map(([k,t])=>{const d=S.done[k]||0,o=S.ok[k]||0;return`<div style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="sel" value="${k}" style="width:26px;height:26px;flex:none"><button class="t" data-k="${k}"><span><b>${t.name}</b><br><small>решено ${o} из ${d}${d?` · ${Math.round(o/d*100)}%`:''}</small></span><span>›</span></button></div><div class="bar"><i style="width:${d?Math.round(o/d*100):0}%"></i></div>`}).join('')+'<div class="row"><button class="b" id="mix">▶ Тренировка по отмеченным</button></div><div class="mut" id="repInfo" style="margin-top:6px"></div></div>';
 document.getElementById('mix').onclick=()=>{const ks=[...document.querySelectorAll('.sel:checked')].map(x=>x.value);if(!ks.length){document.getElementById('repInfo').textContent='Отметь хотя бы одну тему ☑';return}mix=ks;mode=null;streak=0;document.getElementById('menu').hidden=true;document.getElementById('play').hidden=false;ask()};
 }
function ask(){if(mix)mode=pick(mix);cur=T[mode].gen();answered=false;document.getElementById('meta').textContent=T[mode].name+(streak?` · серия ${streak}`:'');
 document.getElementById('pic').innerHTML=cur.pic||'';document.getElementById('q').textContent=cur.q;const a=document.getElementById('a');a.value='';a.focus();
 document.getElementById('res').innerHTML='';['hint','theory','next'].forEach(i=>document.getElementById(i).hidden=true);document.getElementById('check').disabled=false}
function check(){if(answered)return;const v=parseFloat(String(document.getElementById('a').value).replace(',','.').replace(/\s/g,''));if(isNaN(v)){document.getElementById('res').innerHTML='<span class="bad">Напиши число.</span>';return}
 answered=true;const ok=Math.abs(v-cur.a)<=Math.max(0.02,Math.abs(cur.a)*0.01);S.done[mode]=(S.done[mode]||0)+1;
 sess.done++;if(sess.done%10===0)setTimeout(autoReport,0);const w=wk();let earn=0,bonus=false;w.done++;
 if(ok){S.ok[mode]=(S.ok[mode]||0)+1;S.pts++;streak++;sess.ok++;earn=RUB;if(streak%BONUS===0){earn+=BONUS_RUB;bonus=true}S.rub+=earn;w.ok++;w.rub+=earn;sess.rub=(sess.rub||0)+earn}else{streak=0;sess.bad[mode]=(sess.bad[mode]||0)+1};S.log=(S.log||[]).concat([[Date.now(),mode,ok?1:0]]).slice(-500);save();document.getElementById('pts').textContent=S.rub+' ₽';
 document.getElementById('res').innerHTML=ok?`<span class="ok">Верно! +${RUB} ₽${bonus?` · 🔥 ${streak} подряд, бонус +${BONUS_RUB} ₽`:''}</span>`:`<span class="bad">Пока нет. Ответ: ${fmt(cur.a)}</span>`;
 if(!ok){const h=document.getElementById('hint');h.hidden=false;h.textContent='Как решать: '+cur.h;const th=document.getElementById('theory');th.hidden=false;th.textContent='Теория:\n'+T[mode].th}
 document.getElementById('next').hidden=false}
document.getElementById('menu').onclick=e=>{const b=e.target.closest('.t');if(!b)return;mix=null;mode=b.dataset.k;streak=0;document.getElementById('menu').hidden=true;document.getElementById('play').hidden=false;ask()};
document.getElementById('check').onclick=check;document.getElementById('a').onkeydown=e=>{if(e.key==='Enter')answered?ask():check()};
